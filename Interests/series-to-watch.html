<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#ece8df">
	<title>Series to Watch | Rhoomi Vault</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #272522;
			--muted: #6a6761;
			--paper: #fffdf8;
			--wash: #e8e4dc;
			--red: #9d463b;
			--green: #3d604b;
			--gold: #bc8b35;
			--line: #d8d3ca;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background:
				repeating-linear-gradient(0deg, transparent 0 31px, rgba(61, 96, 75, 0.045) 31px 32px),
				var(--wash);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 780px);
			padding: clamp(28px, 7vw, 62px);
			border-top: 8px solid var(--red);
			background: var(--paper);
			box-shadow: 8px 8px 0 rgba(39, 37, 34, 0.12);
		}

		.eyebrow,
		.field label,
		.progress-copy,
		button {
			font-family: "Trebuchet MS", sans-serif;
			font-weight: 700;
			text-transform: uppercase;
		}

		.eyebrow { margin: 0 0 10px; color: var(--red); font-size: 0.8rem; }

		h1 {
			margin: 0;
			font-size: clamp(2.8rem, 10vw, 5.8rem);
			font-weight: 400;
			line-height: 0.95;
		}

		.intro {
			max-width: 600px;
			margin: 20px 0 30px;
			color: var(--muted);
			font-size: 1.06rem;
			line-height: 1.6;
		}

		.add-series {
			display: grid;
			grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto;
			gap: 9px;
			align-items: end;
			margin-bottom: 28px;
		}

		.field { display: grid; gap: 7px; }
		.field label { color: var(--muted); font-size: 0.68rem; }

		input[type="text"] {
			width: 100%;
			min-width: 0;
			height: 46px;
			padding: 0 13px;
			border: 1px solid var(--line);
			border-radius: 4px;
			color: var(--ink);
			background: #fff;
			font: inherit;
		}

		button {
			min-height: 46px;
			padding: 0 16px;
			border: 1px solid var(--green);
			border-radius: 4px;
			color: var(--green);
			background: transparent;
			font-size: 0.7rem;
			cursor: pointer;
		}

		button:hover,
		button:focus-visible { color: #fff; background: var(--green); }
		input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

		.progress-row {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 16px;
			align-items: center;
			margin-bottom: 18px;
		}

		.progress-track {
			height: 9px;
			overflow: hidden;
			border-radius: 5px;
			background: #e2dfd8;
		}

		.progress-bar {
			width: 0;
			height: 100%;
			background: var(--green);
			transition: width 220ms ease;
		}

		.progress-copy { margin: 0; color: var(--green); font-size: 0.7rem; white-space: nowrap; }

		.series-list {
			margin: 0;
			padding: 0;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: #fff;
			list-style: none;
		}

		.series {
			display: grid;
			grid-template-columns: 26px minmax(0, 1fr) 36px;
			gap: 12px;
			align-items: center;
			padding: 18px 20px;
		}

		.series + .series { border-top: 1px solid var(--line); }
		.series input { width: 21px; height: 21px; margin: 0; accent-color: var(--green); cursor: pointer; }
		.series label { min-width: 0; cursor: pointer; overflow-wrap: anywhere; }
		.series-title { display: block; font-size: 1.05rem; }
		.suggested-by { display: block; margin-top: 4px; color: var(--muted); font-size: 0.86rem; }

		.series:has(input:checked) label {
			color: var(--muted);
			text-decoration: line-through;
			text-decoration-color: var(--red);
		}

		.remove {
			width: 36px;
			min-height: 36px;
			padding: 0;
			border-color: transparent;
			color: var(--muted);
			font-size: 1.1rem;
		}

		.empty { margin: 20px 0 0; color: var(--muted); text-align: center; }

		@media (max-width: 640px) {
			body { padding: 0; }
			main { min-height: 100vh; box-shadow: none; }
			.add-series { grid-template-columns: 1fr; }
			.progress-row { grid-template-columns: 1fr; gap: 8px; }
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Watch list</p>
		<h1>Series to Watch</h1>
		<p class="intro">Save series recommendations and remember who suggested each one. Check them off after watching.</p>

		<form class="add-series" id="series-form">
			<div class="field">
				<label for="series-title">Series title</label>
				<input id="series-title" type="text" maxlength="150" placeholder="Add a series" autocomplete="off" required>
			</div>
			<div class="field">
				<label for="suggested-by">Suggested by</label>
				<input id="suggested-by" type="text" maxlength="80" placeholder="Person's name" autocomplete="off">
			</div>
			<button type="submit">Add series</button>
		</form>

		<div class="progress-row" aria-live="polite">
			<div class="progress-track" role="progressbar" aria-label="Watch progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
				<div class="progress-bar"></div>
			</div>
			<p class="progress-copy"><span id="watched-count">0</span> of <span id="series-count">0</span> watched</p>
		</div>

		<ul class="series-list" id="series-list" aria-label="Series to watch"></ul>
		<p class="empty" id="empty-message">No series suggestions yet.</p>
	</main>

	<script>
		const storageKey = "rhoomi-series-to-watch";
		const seriesForm = document.querySelector("#series-form");
		const seriesTitle = document.querySelector("#series-title");
		const suggestedBy = document.querySelector("#suggested-by");
		const seriesList = document.querySelector("#series-list");
		const emptyMessage = document.querySelector("#empty-message");
		const progressTrack = document.querySelector("[role='progressbar']");
		const progressBar = document.querySelector(".progress-bar");
		const watchedCount = document.querySelector("#watched-count");
		const seriesCount = document.querySelector("#series-count");

		function readSeries() {
			try {
				const saved = JSON.parse(localStorage.getItem(storageKey));
				return Array.isArray(saved) ? saved : [];
			} catch {
				return [];
			}
		}

		let series = readSeries();

		function saveSeries() {
			localStorage.setItem(storageKey, JSON.stringify(series));
		}

		function updateProgress() {
			const watched = series.filter(item => item.watched).length;
			const total = series.length;
			watchedCount.textContent = watched;
			seriesCount.textContent = total;
			progressTrack.setAttribute("aria-valuemax", String(total));
			progressTrack.setAttribute("aria-valuenow", String(watched));
			progressBar.style.width = total ? `${(watched / total) * 100}%` : "0%";
		}

		function renderSeries() {
			seriesList.replaceChildren();

			series.forEach(item => {
				const row = document.createElement("li");
				const checkbox = document.createElement("input");
				const label = document.createElement("label");
				const title = document.createElement("span");
				const suggester = document.createElement("span");
				const removeButton = document.createElement("button");
				row.className = "series";
				checkbox.type = "checkbox";
				checkbox.id = `series-${item.id}`;
				checkbox.checked = item.watched;
				checkbox.setAttribute("aria-label", `Watched ${item.title}`);
				checkbox.addEventListener("change", () => {
					item.watched = checkbox.checked;
					saveSeries();
					updateProgress();
				});

				label.htmlFor = checkbox.id;
				title.className = "series-title";
				title.textContent = item.title;
				suggester.className = "suggested-by";
				suggester.textContent = item.suggestedBy ? `Suggested by ${item.suggestedBy}` : "Suggestion";
				label.append(title, suggester);

				removeButton.className = "remove";
				removeButton.type = "button";
				removeButton.textContent = "×";
				removeButton.title = `Remove ${item.title}`;
				removeButton.setAttribute("aria-label", `Remove ${item.title}`);
				removeButton.addEventListener("click", () => {
					series = series.filter(seriesItem => seriesItem.id !== item.id);
					saveSeries();
					renderSeries();
				});

				row.append(checkbox, label, removeButton);
				seriesList.append(row);
			});

			emptyMessage.hidden = series.length > 0;
			seriesList.hidden = series.length === 0;
			updateProgress();
		}

		seriesForm.addEventListener("submit", event => {
			event.preventDefault();
			const title = seriesTitle.value.trim();
			if (!title) return;
			series.push({
				id: `${Date.now()}`,
				title,
				suggestedBy: suggestedBy.value.trim(),
				watched: false
			});
			saveSeries();
			renderSeries();
			seriesForm.reset();
			seriesTitle.focus();
		});

		renderSeries();
	</script>
</body>
</html>
