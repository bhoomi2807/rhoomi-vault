<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f2efe7">
	<title>Task List | Rhoomi Vault</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #252620;
			--muted: #6b6d64;
			--paper: #fffdf8;
			--wash: #e7e6df;
			--green: #3f654d;
			--red: #ae543e;
			--gold: #ba8a35;
			--line: #d7d5cb;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background:
				repeating-linear-gradient(0deg, transparent 0 31px, rgba(63, 101, 77, 0.045) 31px 32px),
				var(--wash);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 720px);
			padding: clamp(28px, 7vw, 60px);
			border-top: 8px solid var(--green);
			background: var(--paper);
			box-shadow: 8px 8px 0 rgba(37, 38, 32, 0.12);
		}

		.eyebrow,
		.progress-copy,
		button {
			font-family: "Trebuchet MS", sans-serif;
			font-weight: 700;
			text-transform: uppercase;
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--green);
			font-size: 0.8rem;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.8rem, 10vw, 5.8rem);
			font-weight: 400;
			line-height: 0.95;
		}

		.intro {
			max-width: 560px;
			margin: 20px 0 28px;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.6;
		}

		.add-task {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 8px;
			margin-bottom: 26px;
		}

		input[type="text"] {
			min-width: 0;
			height: 46px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 4px;
			color: var(--ink);
			background: #fff;
			font: inherit;
		}

		button {
			min-height: 42px;
			padding: 0 16px;
			border: 1px solid var(--green);
			border-radius: 4px;
			color: var(--green);
			background: transparent;
			font-size: 0.72rem;
			cursor: pointer;
		}

		button:hover,
		button:focus-visible {
			color: #fff;
			background: var(--green);
		}

		input:focus-visible,
		button:focus-visible {
			outline: 3px solid var(--gold);
			outline-offset: 2px;
		}

		.progress-row {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 16px;
			align-items: center;
			margin-bottom: 18px;
		}

		.progress-track {
			height: 9px;
			overflow: hidden;
			border-radius: 5px;
			background: #e2e1d8;
		}

		.progress-bar {
			width: 0;
			height: 100%;
			background: var(--green);
			transition: width 220ms ease;
		}

		.progress-copy {
			margin: 0;
			color: var(--green);
			font-size: 0.72rem;
			white-space: nowrap;
		}

		.task-list {
			margin: 0;
			padding: 0;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: #fff;
			list-style: none;
		}

		.task {
			display: grid;
			grid-template-columns: 26px minmax(0, 1fr) 36px;
			gap: 12px;
			align-items: center;
			padding: 18px 20px;
		}

		.task + .task { border-top: 1px solid var(--line); }

		.task label {
			min-width: 0;
			line-height: 1.4;
			overflow-wrap: anywhere;
			cursor: pointer;
		}

		.task input[type="checkbox"] {
			width: 21px;
			height: 21px;
			margin: 0;
			accent-color: var(--green);
			cursor: pointer;
		}

		.task:has(input:checked) label {
			color: var(--muted);
			text-decoration: line-through;
			text-decoration-color: var(--red);
		}

		.remove {
			width: 36px;
			min-height: 36px;
			padding: 0;
			border-color: transparent;
			color: var(--muted);
			font-size: 1.1rem;
		}

		.empty {
			margin: 22px 0 0;
			color: var(--muted);
			text-align: center;
		}

		@media (max-width: 520px) {
			body { padding: 0; }
			main { min-height: 100vh; box-shadow: none; }
			.add-task { grid-template-columns: 1fr; }
			.task { padding-inline: 16px; }
			.progress-row { grid-template-columns: 1fr; gap: 9px; }
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Things to do</p>
		<h1>Task List</h1>
		<p class="intro">Add what needs doing and check each task off when it is complete. Your list is saved in this browser.</p>

		<form class="add-task" id="task-form">
			<label for="task-title" hidden>New task</label>
			<input id="task-title" type="text" maxlength="150" placeholder="Add a task" autocomplete="off" required>
			<button type="submit">Add task</button>
		</form>

		<div class="progress-row" aria-live="polite">
			<div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
				<div class="progress-bar"></div>
			</div>
			<p class="progress-copy"><span id="complete-count">0</span> of <span id="task-count">0</span> complete</p>
		</div>

		<ul class="task-list" id="task-list" aria-label="Tasks"></ul>
		<p class="empty" id="empty-message">No tasks yet.</p>
	</main>

	<script>
		const storageKey = "rhoomi-task-list";
		const taskForm = document.querySelector("#task-form");
		const taskTitle = document.querySelector("#task-title");
		const taskList = document.querySelector("#task-list");
		const emptyMessage = document.querySelector("#empty-message");
		const progressTrack = document.querySelector("[role='progressbar']");
		const progressBar = document.querySelector(".progress-bar");
		const completeCount = document.querySelector("#complete-count");
		const taskCount = document.querySelector("#task-count");

		function readSavedTasks() {
			try {
				const saved = JSON.parse(localStorage.getItem(storageKey));
				return Array.isArray(saved) ? saved : [];
			} catch {
				return [];
			}
		}

		let tasks = readSavedTasks();

		function saveTasks() {
			localStorage.setItem(storageKey, JSON.stringify(tasks));
		}

		function updateProgress() {
			const complete = tasks.filter(task => task.complete).length;
			const total = tasks.length;
			completeCount.textContent = complete;
			taskCount.textContent = total;
			progressTrack.setAttribute("aria-valuemax", String(total));
			progressTrack.setAttribute("aria-valuenow", String(complete));
			progressBar.style.width = total ? `${(complete / total) * 100}%` : "0%";
		}

		function renderTasks() {
			taskList.replaceChildren();

			tasks.forEach(task => {
				const item = document.createElement("li");
				const checkbox = document.createElement("input");
				const label = document.createElement("label");
				const removeButton = document.createElement("button");

				item.className = "task";
				checkbox.type = "checkbox";
				checkbox.id = `task-${task.id}`;
				checkbox.checked = task.complete;
				checkbox.addEventListener("change", () => {
					task.complete = checkbox.checked;
					saveTasks();
					updateProgress();
				});

				label.htmlFor = checkbox.id;
				label.textContent = task.title;

				removeButton.className = "remove";
				removeButton.type = "button";
				removeButton.textContent = "×";
				removeButton.title = `Remove ${task.title}`;
				removeButton.setAttribute("aria-label", `Remove ${task.title}`);
				removeButton.addEventListener("click", () => {
					tasks = tasks.filter(listTask => listTask.id !== task.id);
					saveTasks();
					renderTasks();
				});

				item.append(checkbox, label, removeButton);
				taskList.append(item);
			});

			emptyMessage.hidden = tasks.length > 0;
			taskList.hidden = tasks.length === 0;
			updateProgress();
		}

		taskForm.addEventListener("submit", event => {
			event.preventDefault();
			const title = taskTitle.value.trim();
			if (!title) return;

			tasks.push({ id: String(Date.now()), title, complete: false });
			saveTasks();
			renderTasks();
			taskForm.reset();
			taskTitle.focus();
		});

		renderTasks();
	</script>
</body>
</html>
