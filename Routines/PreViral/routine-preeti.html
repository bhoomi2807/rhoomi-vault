<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f2eee5">
	<title>Preeti's Daily Routine | Rhoomi Vault</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #252722;
			--muted: #696d65;
			--paper: #fffdf8;
			--wash: #e7e7df;
			--green: #41634d;
			--coral: #b85d48;
			--gold: #bd8d39;
			--line: #d6d5cb;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background:
				repeating-linear-gradient(0deg, transparent 0 31px, rgba(65, 99, 77, 0.045) 31px 32px),
				var(--wash);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 720px);
			padding: clamp(28px, 7vw, 60px);
			border-top: 8px solid var(--coral);
			background: var(--paper);
			box-shadow: 8px 8px 0 rgba(37, 39, 34, 0.12);
		}

		.eyebrow,
		.progress-copy,
		button {
			font-family: "Trebuchet MS", sans-serif;
			font-weight: 700;
			text-transform: uppercase;
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--coral);
			font-size: 0.8rem;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.7rem, 10vw, 5.7rem);
			font-weight: 400;
			line-height: 0.95;
		}

		.intro {
			max-width: 560px;
			margin: 20px 0 28px;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.6;
		}

		.add-task {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 8px;
			margin-bottom: 26px;
		}

		input[type="text"] {
			min-width: 0;
			height: 46px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 4px;
			color: var(--ink);
			background: #fff;
			font: inherit;
		}

		button {
			min-height: 42px;
			padding: 0 16px;
			border: 1px solid var(--green);
			border-radius: 4px;
			color: var(--green);
			background: transparent;
			font-size: 0.72rem;
			cursor: pointer;
		}

		button:hover,
		button:focus-visible {
			color: #fff;
			background: var(--green);
		}

		input:focus-visible,
		button:focus-visible {
			outline: 3px solid var(--gold);
			outline-offset: 2px;
		}

		.progress-row {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 16px;
			align-items: center;
			margin-bottom: 18px;
		}

		.progress-track {
			height: 9px;
			overflow: hidden;
			border-radius: 5px;
			background: #e2e1d9;
		}

		.progress-bar {
			width: 0;
			height: 100%;
			background: var(--green);
			transition: width 220ms ease;
		}

		.progress-copy {
			margin: 0;
			color: var(--green);
			font-size: 0.72rem;
		}

		.task-list {
			margin: 0;
			padding: 0;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: #fff;
			list-style: none;
		}

		.task {
			display: grid;
			grid-template-columns: 26px 1fr 36px;
			gap: 12px;
			align-items: center;
			padding: 18px 20px;
		}

		.task + .task { border-top: 1px solid var(--line); }

		.task label {
			line-height: 1.4;
			cursor: pointer;
		}

		.task input[type="checkbox"] {
			width: 21px;
			height: 21px;
			margin: 0;
			accent-color: var(--green);
			cursor: pointer;
		}

		.task:has(input:checked) label {
			color: var(--muted);
			text-decoration: line-through;
			text-decoration-color: var(--coral);
		}

		.remove {
			width: 36px;
			min-height: 36px;
			padding: 0;
			border-color: transparent;
			color: var(--muted);
			font-size: 1.1rem;
		}

		.remove-placeholder { width: 36px; }

		@media (max-width: 520px) {
			body { padding: 0; }
			main { min-height: 100vh; box-shadow: none; }
			.add-task { grid-template-columns: 1fr; }
			.task { padding-inline: 16px; }
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Daily checklist</p>
		<h1>Preeti's Routine</h1>
		<p class="intro">Check off each habit as you go. Your progress and any tasks you add are saved in this browser.</p>

		<form class="add-task" id="task-form">
			<label for="task-title" hidden>New routine task</label>
			<input id="task-title" type="text" maxlength="100" placeholder="Add another task" autocomplete="off" required>
			<button type="submit">Add task</button>
		</form>

		<div class="progress-row" aria-live="polite">
			<div class="progress-track" role="progressbar" aria-label="Routine progress" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
				<div class="progress-bar"></div>
			</div>
			<p class="progress-copy"><span id="complete-count">0</span> of <span id="task-count">7</span> complete</p>
		</div>

		<ul class="task-list" id="task-list" aria-label="Daily routine"></ul>
	</main>

	<script>
		const storageKey = "rhoomi-preeti-routine";
		const defaultTasks = [
			{ id: "exercise", title: "Exercise", complete: false, custom: false },
			{ id: "swim", title: "Swim", complete: false, custom: false },
			{ id: "protein", title: "Protein", complete: false, custom: false },
			{ id: "smile", title: "Smile", complete: false, custom: false },
			{ id: "brush-twice", title: "Brush twice a day", complete: false, custom: false },
			{ id: "water", title: "Drink 2 L water", complete: false, custom: false },
			{ id: "walk", title: "Walk", complete: false, custom: false }
		];

		const taskForm = document.querySelector("#task-form");
		const taskTitle = document.querySelector("#task-title");
		const taskList = document.querySelector("#task-list");
		const progressTrack = document.querySelector("[role='progressbar']");
		const progressBar = document.querySelector(".progress-bar");
		const completeCount = document.querySelector("#complete-count");
		const taskCount = document.querySelector("#task-count");

		function readSavedTasks() {
			try {
				const saved = JSON.parse(localStorage.getItem(storageKey));
				if (!Array.isArray(saved)) return defaultTasks;
				return saved.map(task => task.id === "no-munching"
					? { ...task, id: "swim", title: "Swim" }
					: task
				);
			} catch {
				return defaultTasks;
			}
		}

		let tasks = readSavedTasks();

		function saveTasks() {
			localStorage.setItem(storageKey, JSON.stringify(tasks));
		}

		function updateProgress() {
			const complete = tasks.filter(task => task.complete).length;
			const total = tasks.length;
			completeCount.textContent = complete;
			taskCount.textContent = total;
			progressTrack.setAttribute("aria-valuemax", String(total));
			progressTrack.setAttribute("aria-valuenow", String(complete));
			progressBar.style.width = total ? `${(complete / total) * 100}%` : "0%";
		}

		function renderTasks() {
			taskList.replaceChildren();

			tasks.forEach(task => {
				const item = document.createElement("li");
				const checkbox = document.createElement("input");
				const label = document.createElement("label");
				item.className = "task";

				checkbox.type = "checkbox";
				checkbox.id = `task-${task.id}`;
				checkbox.checked = task.complete;
				checkbox.addEventListener("change", () => {
					task.complete = checkbox.checked;
					saveTasks();
					updateProgress();
				});

				label.htmlFor = checkbox.id;
				label.textContent = task.title;
				item.append(checkbox, label);

				if (task.custom) {
					const removeButton = document.createElement("button");
					removeButton.className = "remove";
					removeButton.type = "button";
					removeButton.textContent = "×";
					removeButton.title = `Remove ${task.title}`;
					removeButton.setAttribute("aria-label", `Remove ${task.title}`);
					removeButton.addEventListener("click", () => {
						tasks = tasks.filter(listTask => listTask.id !== task.id);
						saveTasks();
						renderTasks();
					});
					item.append(removeButton);
				} else {
					const placeholder = document.createElement("span");
					placeholder.className = "remove-placeholder";
					placeholder.setAttribute("aria-hidden", "true");
					item.append(placeholder);
				}

				taskList.append(item);
			});

			updateProgress();
		}

		taskForm.addEventListener("submit", event => {
			event.preventDefault();
			const title = taskTitle.value.trim();
			if (!title) return;

			tasks.push({ id: String(Date.now()), title, complete: false, custom: true });
			saveTasks();
			renderTasks();
			taskForm.reset();
			taskTitle.focus();
		});

		renderTasks();
	</script>
</body>
</html>
